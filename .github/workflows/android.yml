name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, test, and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: release

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release/app-debug.apk "release/JobTracker-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" "release/JobTracker-${GITHUB_REF_NAME}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --title "JobTracker $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
