name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore app signing key
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.JOBTRACKER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo 'Missing JOBTRACKER_DEBUG_KEYSTORE_BASE64 repository secret' >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -F 'SHA256: 79:68:1D:D5:A8:9F:CB:E9:E6:60:87:CE:A3:80:A5:35:1E:B5:37:C2:ED:DD:32:89:3A:6B:7F:57:7C:DE:02:94'

      - name: Build, test, and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload installable APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check app version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one numeric versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping publication."
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.version.outputs.create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: release

      - name: Publish release
        if: steps.version.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mv release/app-debug.apk "release/JobTracker-${RELEASE_TAG}-debug.apk"
          gh release create "$RELEASE_TAG" "release/JobTracker-${RELEASE_TAG}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --title "JobTracker $RELEASE_TAG" \
            --generate-notes --target "$GITHUB_SHA"
