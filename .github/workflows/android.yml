name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore app signing key
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.JOBTRACKER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo 'Missing JOBTRACKER_DEBUG_KEYSTORE_BASE64 repository secret' >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -F 'SHA256: 79:68:1D:D5:A8:9F:CB:E9:E6:60:87:CE:A3:80:A5:35:1E:B5:37:C2:ED:DD:32:89:3A:6B:7F:57:7C:DE:02:94'

      - name: Build, test, and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload installable APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: release

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release/app-debug.apk "release/JobTracker-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" "release/JobTracker-${GITHUB_REF_NAME}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --title "JobTracker $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
