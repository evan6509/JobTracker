name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hold the lock through publication so the next main run sees the new release.
# Branch and PR checks use their own groups and cannot consume a release version.
concurrency:
  group: android-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'publish' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p 'test_release_version.py'

      - name: Assign version to main push
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > releases.json
          python3 scripts/release_version.py releases.json .github/release-version.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore app signing key
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.JOBTRACKER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo 'Missing JOBTRACKER_DEBUG_KEYSTORE_BASE64 repository secret' >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -F 'SHA256: 79:68:1D:D5:A8:9F:CB:E9:E6:60:87:CE:A3:80:A5:35:1E:B5:37:C2:ED:DD:32:89:3A:6B:7F:57:7C:DE:02:94'

      - name: Build, test, and lint
        run: ./gradlew --no-daemon :app:assemblePublishedDebug :app:testPublishedDebugUnitTest :app:lintPublishedDebug

      - name: Verify published APK identity and version
        run: python3 scripts/verify_published_apk.py app/build/outputs/apk/published/debug

      - name: Upload installable APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: app/build/outputs/apk/published/debug/app-published-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; skipping publication."
          else
            # Never attach an APK to an orphaned tag pointing at different code.
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" && \
                [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points at a different commit." >&2
              exit 1
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.existing.outputs.create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: JobTracker-debug-apk
          path: release

      - name: Write release changelog
        if: steps.existing.outputs.create == 'true'
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_CODE: ${{ needs.build.outputs.code }}
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" release-notes.md
          else
            previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
            printf "# What's new in %s\n\n" "${RELEASE_TAG#v}" > release-notes.md
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$GITHUB_SHA" --pretty=format:'- %s' >> release-notes.md
              printf '\n\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" >> release-notes.md
            else
              git log "$GITHUB_SHA" --pretty=format:'- %s' >> release-notes.md
              printf '\n' >> release-notes.md
            fi
          fi
          # Preserve Android's monotonic version code without showing it in notes.
          printf '\n<!-- jobtracker-version-code: %s -->\n' "$RELEASE_CODE" >> release-notes.md

      - name: Publish release
        if: steps.existing.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          mv release/app-published-debug.apk "release/JobTracker-${RELEASE_TAG}-debug.apk"
          gh release create "$RELEASE_TAG" "release/JobTracker-${RELEASE_TAG}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --title "JobTracker $RELEASE_TAG" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
